<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background glow filter -->
    <filter id="coreGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Linear Gradients -->
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9E2C" />
      <stop offset="100%" stop-color="#FF5500" />
    </linearGradient>

    <linearGradient id="cyanGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0066FF" />
      <stop offset="100%" stop-color="#00E5FF" />
    </linearGradient>

    <linearGradient id="darkMetal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#242B38" />
      <stop offset="100%" stop-color="#0F131A" />
    </linearGradient>

    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.03" />
    </linearGradient>
  </defs>

  <!-- Outer Protective Halo Loop -->
  <circle cx="60" cy="60" r="54" stroke="url(#cyanGrad)" stroke-width="1.5" stroke-dasharray="8 6" opacity="0.4" />
  
  <!-- Outer Geometric Octagon Facets -->
  <polygon points="60,8 97,23 112,60 97,97 60,112 23,97 8,60 23,23"
           fill="url(#darkMetal)" stroke="url(#rimGrad)" stroke-width="1.5" />

  <!-- Kinetic Loop Rails (Outer Path) -->
  <path d="M60,18 L90,30 L102,60 L90,90 L60,102 L30,90 L18,60 L30,30 Z"
        fill="none" stroke="#1F2837" stroke-width="3" />

  <!-- Active Kinetic Segments (Infinite Loop Energy) -->
  <path d="M60,18 L90,30 L102,60" fill="none" stroke="url(#amberGrad)" stroke-width="3.5" stroke-linecap="round" filter="url(#coreGlow)" />
  <path d="M60,102 L30,90 L18,60" fill="none" stroke="url(#cyanGrad)" stroke-width="3.5" stroke-linecap="round" filter="url(#coreGlow)" />

  <!-- Isometric Inner Shards & Core -->
  <!-- Top-Right Wing -->
  <polygon points="60,28 82,40 60,60" fill="url(#amberGrad)" opacity="0.9" />
  <!-- Bottom-Left Wing -->
  <polygon points="60,92 38,80 60,60" fill="url(#cyanGrad)" opacity="0.9" />
  <!-- Top-Left Dark Facet -->
  <polygon points="60,28 38,40 60,60" fill="#18202E" />
  <!-- Bottom-Right Dark Facet -->
  <polygon points="60,92 82,80 60,60" fill="#141924" />

  <!-- Center Infinite Loop Singularity / Diamond Node -->
  <polygon points="60,45 73,60 60,75 47,60" fill="#FFFFFF" filter="url(#coreGlow)" />
  <polygon points="60,50 68,60 60,70 52,60" fill="#0D1117" />
  <circle cx="60" cy="60" r="3" fill="url(#amberGrad)" />

  <!-- Orbital Node Markers (Transit Station Badges) -->
  <circle cx="60" cy="8" r="3" fill="#00E5FF" />
  <circle cx="112" cy="60" r="3" fill="#FF9E2C" />
  <circle cx="60" cy="112" r="3" fill="#00E5FF" />
  <circle cx="8" cy="60" r="3" fill="#FF5500" />
</svg>
