<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 120" width="100%" height="100%" fill="none">
  <defs>
    <!-- Core Glow Filters -->
    <filter id="studioAmberGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="studioCyanGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Gradients -->
    <linearGradient id="amberCore" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFA439" />
      <stop offset="60%" stop-color="#FF5500" />
      <stop offset="100%" stop-color="#CC3700" />
    </linearGradient>

    <linearGradient id="cyanCore" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0066FF" />
      <stop offset="50%" stop-color="#00D2FF" />
      <stop offset="100%" stop-color="#70E5FF" />
    </linearGradient>

    <linearGradient id="tungstenPlate" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E2633" />
      <stop offset="100%" stop-color="#0D1117" />
    </linearGradient>

    <linearGradient id="metalRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64748B" />
      <stop offset="50%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>

    <linearGradient id="textShine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="70%" stop-color="#F1F5F9" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>
  </defs>

  <!-- ==================== LOGO EMBLEM (Left: 0 to 120) ==================== -->
  <g transform="translate(10, 10)">
    <!-- Outer Precision Target Reticle / Orbital Ring -->
    <circle cx="50" cy="50" r="46" stroke="#1E293B" stroke-width="1.5" />
    <circle cx="50" cy="50" r="46" stroke="url(#cyanCore)" stroke-width="2" stroke-dasharray="14 36" stroke-linecap="round" opacity="0.8" />
    <circle cx="50" cy="50" r="46" stroke="url(#amberCore)" stroke-width="2" stroke-dasharray="20 45" stroke-dashoffset="25" stroke-linecap="round" opacity="0.8" />

    <!-- Outer Octagonal Armor Plate -->
    <polygon points="50,4 82,18 96,50 82,82 50,96 18,82 4,50 18,18"
             fill="url(#tungstenPlate)" stroke="url(#metalRim)" stroke-width="2" />

    <!-- Kinetic Loop Circuit Tracks -->
    <path d="M50,14 L76,26 L86,50 L76,74 L50,86 L24,74 L14,50 L24,26 Z"
          fill="none" stroke="#141B26" stroke-width="4" />

    <!-- Glowing Kinetic Energy Segments (Infinite Loop Signature) -->
    <!-- Amber Loop (Top Right) -->
    <path d="M50,14 L76,26 L86,50"
          fill="none" stroke="url(#amberCore)" stroke-width="3.5" stroke-linecap="round" filter="url(#studioAmberGlow)" />
    <!-- Cyan Loop (Bottom Left) -->
    <path d="M50,86 L24,74 L14,50"
          fill="none" stroke="url(#cyanCore)" stroke-width="3.5" stroke-linecap="round" filter="url(#studioCyanGlow)" />

    <!-- Internal Facets / Polyhedral Geometry -->
    <polygon points="50,22 68,34 50,50" fill="url(#amberCore)" opacity="0.85" />
    <polygon points="50,78 32,66 50,50" fill="url(#cyanCore)" opacity="0.85" />
    <polygon points="50,22 32,34 50,50" fill="#131922" />
    <polygon points="50,78 68,66 50,50" fill="#0F141C" />

    <!-- Center Singularity Diamond Core -->
    <polygon points="50,38 60,50 50,62 40,50" fill="#FFFFFF" />
    <polygon points="50,42 56,50 50,58 44,50" fill="#0A0D13" />
    <circle cx="50" cy="50" r="2.5" fill="url(#amberCore)" />

    <!-- Precision Tick Marks -->
    <circle cx="50" cy="4" r="2" fill="#00D2FF" />
    <circle cx="96" cy="50" r="2" fill="#FFA439" />
    <circle cx="50" cy="96" r="2" fill="#00D2FF" />
    <circle cx="4" cy="50" r="2" fill="#FF5500" />
  </g>

  <!-- ==================== TYPOGRAPHY (Right: 130 to 540) ==================== -->
  <!-- Brand Name: SAMTAGON -->
  <text x="135" y="60"
        font-family="system-ui, -apple-system, 'Rajdhani', 'SF Pro Display', 'Inter', sans-serif"
        font-weight="900"
        font-size="44"
        letter-spacing="9"
        fill="url(#textShine)">SAMTAGON</text>

  <!-- Studio Subtitle: STUDIOS // SYSTEMS LABORATORY -->
  <text x="138" y="84"
        font-family="'JetBrains Mono', 'Fira Code', monospace"
        font-weight="700"
        font-size="11"
        letter-spacing="5"
        fill="#94A3B8">STUDIOS &bull; SYSTEMS LAB</text>

  <!-- Ambient Underline Accents -->
  <line x1="138" y1="94" x2="210" y2="94" stroke="url(#amberCore)" stroke-width="2.5" stroke-linecap="round" />
  <line x1="216" y1="94" x2="330" y2="94" stroke="url(#cyanCore)" stroke-width="2.5" stroke-linecap="round" />
  <circle cx="338" cy="94" r="2" fill="#00D2FF" />
</svg>
