<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="616" height="353">
  <defs>
    <filter id="pongGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Court -->
  <rect width="600" height="360" fill="#090b10" />

  <!-- Dotted Center Court Net Line -->
  <line x1="300" y1="20" x2="300" y2="340" stroke="#334155" stroke-width="4" stroke-dasharray="12 12" />

  <!-- Left Paddle (Player) -->
  <rect x="36" y="120" width="14" height="90" rx="7" fill="#00d2ff" filter="url(#pongGlow)" />

  <!-- Right Paddle (AI Opponent) -->
  <rect x="550" y="160" width="14" height="90" rx="7" fill="#ff6b00" filter="url(#pongGlow)" />

  <!-- Ball Motion Trail -->
  <circle cx="240" cy="192" r="5" fill="#ffffff" opacity="0.15" />
  <circle cx="280" cy="186" r="6" fill="#ffffff" opacity="0.3" />
  <circle cx="330" cy="178" r="7" fill="#ffffff" opacity="0.55" />
  <!-- Ball -->
  <circle cx="390" cy="168" r="9" fill="#ffffff" filter="url(#pongGlow)" />

  <!-- Score Board -->
  <text x="230" y="70" font-family="monospace" font-size="38" font-weight="900" fill="#00d2ff">07</text>
  <text x="330" y="70" font-family="monospace" font-size="38" font-weight="900" fill="#ff6b00">05</text>

  <!-- HUD -->
  <rect x="24" y="24" width="160" height="28" rx="6" fill="rgba(10, 14, 20, 0.85)" stroke="rgba(255, 255, 255, 0.2)" />
  <text x="34" y="43" font-family="monospace" font-size="11" fill="#94a3b8" font-weight="700">CASUAL // 60 FPS</text>
</svg>
