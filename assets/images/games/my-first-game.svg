<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="616" height="353">
  <defs>
    <linearGradient id="godotSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e2c3b" />
      <stop offset="100%" stop-color="#0e1722" />
    </linearGradient>
  </defs>

  <!-- Sky & Mountains -->
  <rect width="600" height="360" fill="url(#godotSky)" />
  <polygon points="0,320 120,180 260,320" fill="#182330" opacity="0.6" />
  <polygon points="200,320 380,140 520,320" fill="#141c27" opacity="0.8" />
  <polygon points="420,320 540,200 600,280 600,320" fill="#182330" opacity="0.6" />

  <!-- Ground -->
  <rect x="0" y="280" width="600" height="80" fill="#293949" stroke="#478cbf" stroke-width="2" />
  <rect x="0" y="276" width="600" height="4" fill="#478cbf" />

  <!-- Pixel Knight Hero -->
  <g transform="translate(140, 230)">
    <!-- Shield / Armor -->
    <rect x="-12" y="-28" width="24" height="34" rx="4" fill="#478cbf" />
    <rect x="-8" y="-36" width="16" height="12" rx="3" fill="#ffffff" />
    <rect x="-4" y="-32" width="12" height="4" fill="#1e2c3b" />
    <!-- Sword -->
    <rect x="14" y="-30" width="4" height="26" fill="#e0e0e0" />
    <rect x="10" y="-12" width="12" height="4" fill="#ffd166" />
  </g>

  <!-- Collectible Coins -->
  <g transform="translate(260, 220)">
    <circle cx="0" cy="0" r="10" fill="#ffd166" stroke="#e09f3e" stroke-width="2" />
    <text x="-4" y="4" font-family="monospace" font-size="10" font-weight="900" fill="#9e2a2b">$</text>
  </g>
  <g transform="translate(320, 190)">
    <circle cx="0" cy="0" r="10" fill="#ffd166" stroke="#e09f3e" stroke-width="2" />
    <text x="-4" y="4" font-family="monospace" font-size="10" font-weight="900" fill="#9e2a2b">$</text>
  </g>
  <g transform="translate(380, 220)">
    <circle cx="0" cy="0" r="10" fill="#ffd166" stroke="#e09f3e" stroke-width="2" />
    <text x="-4" y="4" font-family="monospace" font-size="10" font-weight="900" fill="#9e2a2b">$</text>
  </g>

  <!-- Flag Goal -->
  <line x1="480" y1="280" x2="480" y2="180" stroke="#fff" stroke-width="3" />
  <polygon points="480,180 520,195 480,210" fill="#06d6a0" />

  <!-- HUD -->
  <rect x="24" y="24" width="220" height="32" rx="6" fill="rgba(14, 23, 34, 0.85)" stroke="rgba(71, 140, 191, 0.4)" />
  <text x="36" y="45" font-family="monospace" font-size="12" fill="#478cbf" font-weight="700">GODOT // 1ST ADVENTURE</text>
</svg>
