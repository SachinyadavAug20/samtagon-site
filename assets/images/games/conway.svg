<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="616" height="353">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0f2b38" />
      <stop offset="100%" stop-color="#070a0e" />
    </radialGradient>
    <filter id="cellGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="360" fill="url(#bgGlow)" />

  <!-- Grid lines -->
  <g stroke="rgba(255, 255, 255, 0.05)" stroke-width="1">
    <line x1="0" y1="40" x2="600" y2="40" /><line x1="0" y1="80" x2="600" y2="80" /><line x1="0" y1="120" x2="600" y2="120" /><line x1="0" y1="160" x2="600" y2="160" /><line x1="0" y1="200" x2="600" y2="200" /><line x1="0" y1="240" x2="600" y2="240" /><line x1="0" y1="280" x2="600" y2="280" /><line x1="0" y1="320" x2="600" y2="320" />
    <line x1="40" y1="0" x2="40" y2="360" /><line x1="80" y1="0" x2="80" y2="360" /><line x1="120" y1="0" x2="120" y2="360" /><line x1="160" y1="0" x2="160" y2="360" /><line x1="200" y1="0" x2="200" y2="360" /><line x1="240" y1="0" x2="240" y2="360" /><line x1="280" y1="0" x2="280" y2="360" /><line x1="320" y1="0" x2="320" y2="360" /><line x1="360" y1="0" x2="360" y2="360" /><line x1="400" y1="0" x2="400" y2="360" /><line x1="440" y1="0" x2="440" y2="360" /><line x1="480" y1="0" x2="480" y2="360" /><line x1="520" y1="0" x2="520" y2="360" /><line x1="560" y1="0" x2="560" y2="360" />
  </g>

  <!-- Cellular Automata Active Living Cells -->
  <!-- Glider Pattern 1 -->
  <g fill="#00e5ff" filter="url(#cellGlow)">
    <rect x="122" y="82" width="36" height="36" rx="6" />
    <rect x="162" y="122" width="36" height="36" rx="6" />
    <rect x="82" y="162" width="36" height="36" rx="6" />
    <rect x="122" y="162" width="36" height="36" rx="6" />
    <rect x="162" y="162" width="36" height="36" rx="6" />
  </g>

  <!-- Pulsar / Oscillator Cluster -->
  <g fill="#ff9e2c" filter="url(#cellGlow)">
    <rect x="282" y="122" width="36" height="36" rx="6" />
    <rect x="322" y="122" width="36" height="36" rx="6" />
    <rect x="362" y="122" width="36" height="36" rx="6" />
    <rect x="322" y="82" width="36" height="36" rx="6" />
    <rect x="322" y="162" width="36" height="36" rx="6" />
  </g>

  <!-- Glider 2 -->
  <g fill="#00e676" filter="url(#cellGlow)">
    <rect x="442" y="202" width="36" height="36" rx="6" />
    <rect x="482" y="242" width="36" height="36" rx="6" />
    <rect x="402" y="282" width="36" height="36" rx="6" />
    <rect x="442" y="282" width="36" height="36" rx="6" />
    <rect x="482" y="282" width="36" height="36" rx="6" />
  </g>

  <!-- HUD Overlay -->
  <rect x="24" y="24" width="220" height="32" rx="6" fill="rgba(8, 12, 18, 0.85)" stroke="rgba(0, 229, 255, 0.3)" />
  <text x="36" y="45" font-family="monospace" font-size="12" fill="#00e5ff" font-weight="700">RAYLIB C++17 // ZERO PLAYER</text>
</svg>
