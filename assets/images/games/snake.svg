<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="616" height="353">
  <defs>
    <filter id="neonSnake" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Arcade Screen -->
  <rect width="600" height="360" fill="#080d08" />

  <!-- Grid mesh -->
  <g stroke="rgba(0, 230, 118, 0.08)" stroke-width="1">
    <line x1="0" y1="30" x2="600" y2="30" /><line x1="0" y1="60" x2="600" y2="60" /><line x1="0" y1="90" x2="600" y2="90" /><line x1="0" y1="120" x2="600" y2="120" /><line x1="0" y1="150" x2="600" y2="150" /><line x1="0" y1="180" x2="600" y2="180" /><line x1="0" y1="210" x2="600" y2="210" /><line x1="0" y1="240" x2="600" y2="240" /><line x1="0" y1="270" x2="600" y2="270" /><line x1="0" y1="300" x2="600" y2="300" /><line x1="0" y1="330" x2="600" y2="330" />
    <line x1="30" y1="0" x2="30" y2="360" /><line x1="60" y1="0" x2="60" y2="360" /><line x1="90" y1="0" x2="90" y2="360" /><line x1="120" y1="0" x2="120" y2="360" /><line x1="150" y1="0" x2="150" y2="360" /><line x1="180" y1="0" x2="180" y2="360" /><line x1="210" y1="0" x2="210" y2="360" /><line x1="240" y1="0" x2="240" y2="360" /><line x1="270" y1="0" x2="270" y2="360" /><line x1="300" y1="0" x2="300" y2="360" /><line x1="330" y1="0" x2="330" y2="360" /><line x1="360" y1="0" x2="360" y2="360" /><line x1="390" y1="0" x2="390" y2="360" /><line x1="420" y1="0" x2="420" y2="360" /><line x1="450" y1="0" x2="450" y2="360" /><line x1="480" y1="0" x2="480" y2="360" /><line x1="510" y1="0" x2="510" y2="360" /><line x1="540" y1="0" x2="540" y2="360" /><line x1="570" y1="0" x2="570" y2="360" />
  </g>

  <!-- Glowing Snake Body -->
  <g fill="#00e676" filter="url(#neonSnake)">
    <!-- Head -->
    <rect x="362" y="152" width="26" height="26" rx="5" fill="#69f0ae" />
    <rect x="332" y="152" width="26" height="26" rx="5" />
    <rect x="302" y="152" width="26" height="26" rx="5" />
    <rect x="272" y="152" width="26" height="26" rx="5" />
    <rect x="272" y="182" width="26" height="26" rx="5" />
    <rect x="272" y="212" width="26" height="26" rx="5" />
    <rect x="242" y="212" width="26" height="26" rx="5" />
    <rect x="212" y="212" width="26" height="26" rx="5" />
    <rect x="182" y="212" width="26" height="26" rx="5" />
  </g>

  <!-- Apple Target Food -->
  <circle cx="435" cy="165" r="11" fill="#ff1744" filter="url(#neonSnake)" />
  <circle cx="433" cy="163" r="3" fill="#fff" />

  <!-- Score HUD -->
  <rect x="24" y="24" width="200" height="32" rx="6" fill="rgba(8, 13, 8, 0.85)" stroke="rgba(0, 230, 118, 0.4)" />
  <text x="36" y="45" font-family="monospace" font-size="12" fill="#00e676" font-weight="700">ARCADE // SCORE: 1240</text>
</svg>
