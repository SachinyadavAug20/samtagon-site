<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="alienSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#190d2e" />
      <stop offset="100%" stop-color="#090514" />
    </linearGradient>
    <filter id="laserGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Sky -->
  <rect width="600" height="360" fill="url(#alienSky)" />

  <!-- Stars -->
  <circle cx="80" cy="50" r="1.5" fill="#fff" opacity="0.6" />
  <circle cx="210" cy="30" r="2" fill="#ff70a6" opacity="0.8" />
  <circle cx="340" cy="70" r="1.5" fill="#ffd166" opacity="0.5" />
  <circle cx="490" cy="40" r="2" fill="#fff" opacity="0.7" />
  <circle cx="560" cy="90" r="1.5" fill="#06d6a0" opacity="0.6" />

  <!-- Platforms (Level 1-3 terrain) -->
  <rect x="0" y="300" width="600" height="60" fill="#241b35" stroke="#7b2cbf" stroke-width="2" />
  <rect x="0" y="296" width="600" height="4" fill="#9d4edd" />

  <!-- Floating Floating Platforms -->
  <rect x="120" y="220" width="140" height="20" rx="4" fill="#3c096c" stroke="#9d4edd" stroke-width="1.5" />
  <rect x="320" y="160" width="160" height="20" rx="4" fill="#3c096c" stroke="#9d4edd" stroke-width="1.5" />
  <rect x="60" y="120" width="100" height="18" rx="4" fill="#3c096c" stroke="#9d4edd" stroke-width="1.5" />

  <!-- 2D Platformer Character Hero -->
  <g transform="translate(180, 168)">
    <!-- Body -->
    <rect x="-14" y="-24" width="28" height="32" rx="6" fill="#00f5d4" />
    <!-- Visor -->
    <rect x="0" y="-20" width="14" height="10" rx="3" fill="#140152" />
    <rect x="4" y="-18" width="8" height="6" rx="2" fill="#fee440" />
    <!-- Gun Cannon -->
    <rect x="10" y="-12" width="18" height="6" rx="2" fill="#f72585" />
    <!-- Jetpack flame -->
    <polygon points="-16,-6 -26,-2 -16,2" fill="#ff006e" filter="url(#laserGlow)" />
  </g>

  <!-- Laser Projectile blast -->
  <line x1="210" y1="162" x2="310" y2="162" stroke="#f72585" stroke-width="5" stroke-linecap="round" filter="url(#laserGlow)" />
  <line x1="210" y1="162" x2="310" y2="162" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />

  <!-- Alien Drone Enemy -->
  <g transform="translate(380, 110)">
    <circle cx="0" cy="0" r="18" fill="#e63946" stroke="#ff4d6d" stroke-width="2" filter="url(#laserGlow)" />
    <circle cx="0" cy="0" r="6" fill="#fff" />
    <polygon points="-8,18 0,26 8,18" fill="#ff4d6d" />
  </g>

  <!-- HUD -->
  <rect x="24" y="24" width="200" height="32" rx="6" fill="rgba(10, 5, 20, 0.85)" stroke="rgba(247, 37, 133, 0.4)" />
  <text x="36" y="45" font-family="monospace" font-size="12" fill="#f72585" font-weight="700">UNITY 2D // LEVEL 1-3</text>
</svg>
