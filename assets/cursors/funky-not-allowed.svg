<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" fill="none">
  <defs>
    <filter id="na-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="2" dy="3.5" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.42" />
    </filter>
    <linearGradient id="na-edge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.95" />
      <stop offset="35%" stop-color="#fb7185" stop-opacity="0.9" />
      <stop offset="70%" stop-color="#f472b6" stop-opacity="0.92" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.88" />
    </linearGradient>
    <linearGradient id="na-face" x1="15%" y1="10%" x2="90%" y2="90%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85" />
      <stop offset="35%" stop-color="#ffe4e6" stop-opacity="0.45" />
      <stop offset="70%" stop-color="#fdf4ff" stop-opacity="0.40" />
      <stop offset="100%" stop-color="#fbcfe8" stop-opacity="0.60" />
    </linearGradient>
    <linearGradient id="na-rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="30%" stop-color="#fda4af" stop-opacity="0.92" />
      <stop offset="70%" stop-color="#f43f5e" stop-opacity="0.88" />
      <stop offset="100%" stop-color="#e11d48" stop-opacity="0.92" />
    </linearGradient>
  </defs>

  <g filter="url(#na-shadow)">
    <!-- 3D Under-Bevel -->
    <circle cx="24" cy="24" r="16" fill="none" stroke="url(#na-edge)" stroke-width="4.5" transform="translate(2.5, 3.0)" />
    <line x1="13" y1="13" x2="35" y2="35" stroke="url(#na-edge)" stroke-width="4.5" stroke-linecap="round" transform="translate(2.5, 3.0)" />
    <!-- Dark Contour -->
    <circle cx="24" cy="24" r="16" fill="none" stroke="#0f172a" stroke-width="4" stroke-opacity="0.25" />
    <line x1="13" y1="13" x2="35" y2="35" stroke="#0f172a" stroke-width="4" stroke-linecap="round" stroke-opacity="0.25" />
    <!-- Glass Ring & Slash -->
    <circle cx="24" cy="24" r="16" fill="url(#na-face)" stroke="url(#na-rim)" stroke-width="3.2" />
    <line x1="13" y1="13" x2="35" y2="35" stroke="url(#na-rim)" stroke-width="3.2" stroke-linecap="round" />
    <!-- Specular Highlight Arc -->
    <path d="M 12 20 A 13 13 0 0 1 24 11" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.95" />
  </g>
</svg>
