<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" fill="none">
  <defs>
    <filter id="zo-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="2" dy="3.5" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.42" />
    </filter>
    <linearGradient id="zo-edge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.95" />
      <stop offset="30%" stop-color="#2dd4bf" stop-opacity="0.9" />
      <stop offset="70%" stop-color="#f472b6" stop-opacity="0.92" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.88" />
    </linearGradient>
    <linearGradient id="zo-lens" x1="15%" y1="10%" x2="90%" y2="90%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.75" />
      <stop offset="35%" stop-color="#e0f2fe" stop-opacity="0.30" />
      <stop offset="70%" stop-color="#fdf4ff" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#fbcfe8" stop-opacity="0.45" />
    </linearGradient>
    <linearGradient id="zo-rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="30%" stop-color="#a5f3fc" stop-opacity="0.92" />
      <stop offset="70%" stop-color="#f472b6" stop-opacity="0.88" />
      <stop offset="100%" stop-color="#e879f9" stop-opacity="0.92" />
    </linearGradient>
  </defs>

  <g filter="url(#zo-shadow)">
    <!-- 3D Under-Bevel -->
    <circle cx="18" cy="18" r="13" fill="url(#zo-edge)" stroke="url(#zo-edge)" stroke-width="2.5" transform="translate(2.5, 3.0)" />
    <line x1="28" y1="28" x2="41" y2="41" stroke="url(#zo-edge)" stroke-width="5" stroke-linecap="round" transform="translate(2.5, 3.0)" />
    <!-- Dark Contour -->
    <circle cx="18" cy="18" r="13" fill="none" stroke="#0f172a" stroke-width="2" stroke-opacity="0.25" />
    <line x1="28" y1="28" x2="41" y2="41" stroke="#0f172a" stroke-width="4.5" stroke-linecap="round" stroke-opacity="0.25" />
    <!-- Lens Body -->
    <circle cx="18" cy="18" r="13" fill="url(#zo-lens)" stroke="url(#zo-rim)" stroke-width="2.2" />
    <!-- Handle -->
    <line x1="28" y1="28" x2="41" y2="41" stroke="url(#zo-rim)" stroke-width="3.5" stroke-linecap="round" />
    <!-- Specular Arc -->
    <path d="M 10 14 A 10 10 0 0 1 22 8" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.95" />
    <!-- Inner Minus Sign -->
    <line x1="13" y1="18" x2="23" y2="18" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
  </g>
</svg>
