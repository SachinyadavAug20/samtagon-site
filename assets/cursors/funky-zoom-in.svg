<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" fill="none">
  <defs>
    <filter id="z-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="2" dy="3.5" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.42" />
    </filter>
    <linearGradient id="z-edge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.95" />
      <stop offset="30%" stop-color="#f59e0b" stop-opacity="0.95" />
      <stop offset="70%" stop-color="#d97706" stop-opacity="0.92" />
      <stop offset="100%" stop-color="#fb7185" stop-opacity="0.90" />
    </linearGradient>
    <linearGradient id="z-lens" x1="15%" y1="10%" x2="90%" y2="90%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.80" />
      <stop offset="40%" stop-color="#fef3c7" stop-opacity="0.40" />
      <stop offset="70%" stop-color="#fff7ed" stop-opacity="0.30" />
      <stop offset="100%" stop-color="#fde68a" stop-opacity="0.55" />
    </linearGradient>
    <linearGradient id="z-rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.98" />
      <stop offset="30%" stop-color="#fef08a" stop-opacity="0.95" />
      <stop offset="70%" stop-color="#f59e0b" stop-opacity="0.90" />
      <stop offset="100%" stop-color="#fb7185" stop-opacity="0.92" />
    </linearGradient>
  </defs>

  <g filter="url(#z-shadow)">
    <!-- 3D Under-Bevel -->
    <circle cx="18" cy="18" r="13" fill="url(#z-edge)" stroke="url(#z-edge)" stroke-width="2.5" transform="translate(2.5, 3.0)" />
    <line x1="28" y1="28" x2="41" y2="41" stroke="url(#z-edge)" stroke-width="5" stroke-linecap="round" transform="translate(2.5, 3.0)" />
    <!-- Dark Contour -->
    <circle cx="18" cy="18" r="13" fill="none" stroke="#0f172a" stroke-width="2" stroke-opacity="0.25" />
    <line x1="28" y1="28" x2="41" y2="41" stroke="#0f172a" stroke-width="4.5" stroke-linecap="round" stroke-opacity="0.25" />
    <!-- Lens Body -->
    <circle cx="18" cy="18" r="13" fill="url(#z-lens)" stroke="url(#z-rim)" stroke-width="2.2" />
    <!-- Handle -->
    <line x1="28" y1="28" x2="41" y2="41" stroke="url(#z-rim)" stroke-width="3.5" stroke-linecap="round" />
    <!-- Specular Arc -->
    <path d="M 10 14 A 10 10 0 0 1 22 8" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.95" />
    <!-- Inner Plus Sign -->
    <line x1="18" y1="13" x2="18" y2="23" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
    <line x1="13" y1="18" x2="23" y2="18" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
  </g>
</svg>
