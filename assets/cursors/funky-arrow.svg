<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" fill="none">
  <defs>
    <!-- Soft Glass Drop Shadow for clarity on all backgrounds -->
    <filter id="glass-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="2" dy="3.5" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.42" />
    </filter>

    <!-- 3D Glass Side Extrusion Ember Accent Gradient -->
    <linearGradient id="glass-edge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.95" />
      <stop offset="30%" stop-color="#f59e0b" stop-opacity="0.95" />
      <stop offset="70%" stop-color="#d97706" stop-opacity="0.92" />
      <stop offset="100%" stop-color="#fb7185" stop-opacity="0.90" />
    </linearGradient>

    <!-- Translucent Frosted Glass Face Gradient (Champagne to Warm Ember Glass) -->
    <linearGradient id="glass-face" x1="10%" y1="10%" x2="95%" y2="95%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.86" />
      <stop offset="35%" stop-color="#fef3c7" stop-opacity="0.52" />
      <stop offset="70%" stop-color="#fff7ed" stop-opacity="0.42" />
      <stop offset="100%" stop-color="#fde68a" stop-opacity="0.65" />
    </linearGradient>

    <!-- Warm Amber Ember Rim Stroke -->
    <linearGradient id="rim-stroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.98" />
      <stop offset="30%" stop-color="#fef08a" stop-opacity="0.95" />
      <stop offset="70%" stop-color="#f59e0b" stop-opacity="0.90" />
      <stop offset="100%" stop-color="#fb7185" stop-opacity="0.92" />
    </linearGradient>
  </defs>

  <g filter="url(#glass-shadow)">
    <!-- 1. 3D Under-Bevel Depth Extrusion (Shifted down-right) -->
    <path 
      d="M 5 4 L 5 33 C 5 34.5 6.8 35.3 7.8 34.2 L 13.5 28.5 L 20.2 42.5 C 20.8 43.6 22.2 44 23.3 43.4 L 27.5 41.2 C 28.6 40.6 29 39.2 28.4 38.1 L 21.8 24.5 L 31.2 24.5 C 32.6 24.5 33.2 22.8 32.2 21.8 L 6.5 2.2 C 5.6 1.4 5 2.1 5 3.2 Z"
      fill="url(#glass-edge)"
      stroke="url(#glass-edge)"
      stroke-width="1.8"
      stroke-linejoin="round"
      stroke-linecap="round"
      transform="translate(2.8, 3.2)"
    />

    <!-- 2. Dark delicate ambient contour for contrast on pure white canvas -->
    <path 
      d="M 5 4 L 5 33 C 5 34.5 6.8 35.3 7.8 34.2 L 13.5 28.5 L 20.2 42.5 C 20.8 43.6 22.2 44 23.3 43.4 L 27.5 41.2 C 28.6 40.6 29 39.2 28.4 38.1 L 21.8 24.5 L 31.2 24.5 C 32.6 24.5 33.2 22.8 32.2 21.8 L 6.5 2.2 C 5.6 1.4 5 2.1 5 3.2 Z"
      fill="none"
      stroke="#0f172a"
      stroke-width="1.6"
      stroke-opacity="0.25"
      stroke-linejoin="round"
      stroke-linecap="round"
    />

    <!-- 3. Main Glass Surface Body -->
    <path 
      d="M 5 4 L 5 33 C 5 34.5 6.8 35.3 7.8 34.2 L 13.5 28.5 L 20.2 42.5 C 20.8 43.6 22.2 44 23.3 43.4 L 27.5 41.2 C 28.6 40.6 29 39.2 28.4 38.1 L 21.8 24.5 L 31.2 24.5 C 32.6 24.5 33.2 22.8 32.2 21.8 L 6.5 2.2 C 5.6 1.4 5 2.1 5 3.2 Z"
      fill="url(#glass-face)"
      stroke="url(#rim-stroke)"
      stroke-width="1.8"
      stroke-linejoin="round"
      stroke-linecap="round"
    />

    <!-- 4. Glossy Specular White Edge Glare Highlight (Top Leading Rim) -->
    <path 
      d="M 6.2 5.5 L 6.2 31 M 7 5.5 L 28.5 22.5"
      stroke="#ffffff"
      stroke-width="1.4"
      stroke-linecap="round"
      stroke-opacity="0.95"
    />

    <!-- 5. Secondary Lower Stem Specular Glimmer -->
    <path 
      d="M 21.2 26 L 27 38.2"
      stroke="#ffffff"
      stroke-width="1.0"
      stroke-linecap="round"
      stroke-opacity="0.75"
    />

    <!-- 6. Tip Specular Point Light Glint -->
    <circle cx="6.5" cy="5.5" r="1.2" fill="#ffffff" opacity="0.9" />
  </g>
</svg>