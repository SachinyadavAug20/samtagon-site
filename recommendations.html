<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Game Recommendations &bull; SAMTAGON</title>
  <meta name="title" content="Game Recommendations &bull; SAMTAGON">
  <meta name="description" content="Discover games and similar recommendations based on genre, gameplay, and mood.">
  <meta name="author" content="Samtagon Game Studios">
  <link rel="icon" type="image/svg+xml" href="assets/logos/favicon.svg">

  <!-- Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">

  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/variables.css?v=8.0">
  <link rel="stylesheet" href="css/base.css?v=8.0">
  <link rel="stylesheet" href="css/components.css?v=8.0">
  <link rel="stylesheet" href="css/recommendations.css?v=3.0">
  <!-- Theme Initialization -->
  <script>
    (function() {
      var saved = localStorage.getItem('samtagon_theme');
      var params = new URLSearchParams(window.location.search);
      var theme = params.get('theme') || saved || 'dark';
      if (theme === 'light') {
        document.documentElement.removeAttribute('data-theme');
      } else {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();
  </script>
</head>
<body class="rec-page">

  <!-- Minimalist Top Navigation with Mode Tabs -->
  <div class="rec-top-bar">
    <div class="container top-nav-container">
      <a href="index.html" class="rec-back-btn" aria-label="Home" title="Home">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="19" y1="12" x2="5" y2="12"></line>
          <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
        <span>Home</span>
      </a>

      <!-- Central Mode Switcher Tabs -->
      <nav class="rec-nav-tabs" role="tablist" aria-label="Recommendation modes">
        <button id="tab-quiz-btn" class="rec-tab-btn active" role="tab" aria-selected="true" aria-controls="view-quiz">
          <svg class="tab-btn-icon-svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="6" y1="12" x2="10" y2="12"></line>
            <line x1="8" y1="10" x2="8" y2="14"></line>
            <circle cx="15" cy="13" r="1" fill="currentColor"></circle>
            <circle cx="18" cy="11" r="1" fill="currentColor"></circle>
            <rect x="2" y="6" width="20" height="12" rx="6"></rect>
          </svg>
          <span id="tab-quiz-label">Gamer Quest</span>
        </button>
        <button id="tab-explore-btn" class="rec-tab-btn" role="tab" aria-selected="false" aria-controls="view-explore">
          <svg class="tab-btn-icon-svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <span>Fuzzy Find</span>
          <span class="tab-badge-pill">12,000+</span>
        </button>
      </nav>

      <div class="rec-top-actions">
        <button id="audio-toggle-btn" class="icon-btn" aria-label="Toggle sound effects [M]" title="Toggle sound effects [M]">
          <svg class="audio-on-icon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
            <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/>
          </svg>
          <svg class="audio-off-icon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display: none;">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
            <line x1="23" y1="9" x2="17" y2="15"/>
            <line x1="17" y1="9" x2="23" y2="15"/>
          </svg>
        </button>
        <button id="theme-toggle-btn" class="icon-btn" aria-label="Toggle theme [T]" title="Toggle theme [T]">
          <svg class="sun-icon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
            <line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
          </svg>
          <svg class="moon-icon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
          </svg>
        </button>
      </div>
    </div>
  </div>

  <main class="rec-main-wrapper">
    <!-- TAB VIEW 1: Full-Screen 1-Question Game Mode & Profile Dashboard -->
    <div id="view-quiz" class="rec-tab-view active" role="tabpanel" aria-labelledby="tab-quiz-btn">
      <div class="container quiz-screen-container">
        <!-- State 1: Active 1 Question per Screen Game Form -->
        <div id="quiz-active-box" class="quiz-game-stage">
          <div class="quiz-meta-bar">
            <div class="quiz-step-indicator" id="quiz-step-indicator">Question 1 of 10</div>
          </div>

          <div class="quiz-track">
            <div class="quiz-track-fill" id="quiz-track-fill" style="width: 10%;"></div>
          </div>

          <!-- Dynamic Question Body (Scenario, situation, 4 massive cards) -->
          <div class="quiz-body" id="quiz-body">
            <!-- Injected dynamically by TypeScript -->
          </div>

          <!-- Quiz Navigation & Accessibility Controls -->
          <div class="quiz-footer-row">
            <button id="quiz-back-btn" class="quiz-action-btn" style="visibility: hidden;">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
              <span>Back</span>
            </button>
          </div>
        </div>

        <!-- State 2: Tailored Profile & Arranged Samtagon Games (Saved in Cookies) -->
        <div id="quiz-profile-box" class="quiz-profile-box" style="display: none;">
          <!-- Injected dynamically by TypeScript with Profile Hero, CTA to Explore tab, and Arranged Games Grid -->
        </div>
      </div>
    </div>

    <!-- TAB VIEW 2: Explore Catalog Section (12,000+ Games featuring Minecraft, GTA, CS2, etc.) -->
    <div id="view-explore" class="rec-tab-view" style="display: none;" role="tabpanel" aria-labelledby="tab-explore-btn">
      <section class="rec-hero-clean">
        <div class="container">
          <div class="rec-hero-intro">
            <h1 class="rec-title">Fuzzy Find 12,000+ Games</h1>
          </div>

          <!-- Modern SVG Search Control Bar -->
          <div class="search-bar-unified">
            <div class="search-input-prefix">
              <svg class="search-icon-svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
                <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
              </svg>
            </div>
            <input
              type="text"
              id="search-input"
              class="search-input-field"
              placeholder="Fuzzy find 12,000+ games..."
              autocomplete="off"
              spellcheck="false"
            />
            <!-- Pure SVG Controllers & Tools -->
            <div class="search-controllers-group">
              <button id="filter-controller-btn" class="search-ctrl-btn" data-mode="controller" title="Controller / Gamepad Action" aria-label="Controller Supported Games">
                <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <line x1="6" y1="12" x2="10" y2="12"></line>
                  <line x1="8" y1="10" x2="8" y2="14"></line>
                  <circle cx="15" cy="13" r="1" fill="currentColor"></circle>
                  <circle cx="18" cy="11" r="1" fill="currentColor"></circle>
                  <rect x="2" y="6" width="20" height="12" rx="6"></rect>
                </svg>
              </button>

              <button id="filter-multiplayer-btn" class="search-ctrl-btn" data-mode="multiplayer" title="Multiplayer & Co-op" aria-label="Multiplayer Games">
                <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                  <circle cx="9" cy="7" r="4"></circle>
                  <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                  <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
                </svg>
              </button>

              <button id="filter-toprated-btn" class="search-ctrl-btn" data-mode="toprated" title="Top Rated (98%+)" aria-label="Top Rated Games">
                <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
                </svg>
              </button>

              <button id="filter-random-btn" class="search-ctrl-btn" data-mode="random" title="Surprise Me (Random Page)" aria-label="Random Discovery">
                <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="3" y="3" width="18" height="18" rx="3" ry="3"></rect>
                  <circle cx="8" cy="8" r="1.5" fill="currentColor"></circle>
                  <circle cx="16" cy="16" r="1.5" fill="currentColor"></circle>
                  <circle cx="12" cy="12" r="1.5" fill="currentColor"></circle>
                  <circle cx="16" cy="8" r="1.5" fill="currentColor"></circle>
                  <circle cx="8" cy="16" r="1.5" fill="currentColor"></circle>
                </svg>
              </button>

              <button id="clear-search-btn" class="search-ctrl-btn clear-search-btn" title="Reset Search" aria-label="Clear search" style="display: none;">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                  <line x1="18" y1="6" x2="6" y2="18"></line>
                  <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
              </button>
            </div>
          </div>
        </div>
      </section>

      <!-- Catalog Exploration Grid -->
      <section class="rec-catalog-section" id="search-section">
        <div class="container">
          <div class="search-results-header">
            <h2 class="search-results-heading" id="catalog-heading">Game Catalog</h2>
            <span class="results-count-tag" id="result-count">Page 1 of 1,000 &bull; 12,000 titles</span>
          </div>

          <div class="games-grid" id="search-results-grid">
            <!-- Injected dynamically -->
          </div>

          <!-- Modern Responsive Pagination Bar (1,000 Pages of Games) -->
          <nav class="rec-pagination-wrap" id="pagination-wrap" aria-label="Catalog pages">
            <div class="pagination-controls" id="pagination-controls">
              <!-- Injected dynamically: First, Prev, Page numbers, Next, Last -->
            </div>
            <div class="pagination-jump">
              <input type="number" id="page-jump-input" min="1" max="1000" placeholder="#" class="page-jump-input" title="Page number" />
              <button id="page-jump-btn" class="page-jump-btn" title="Go" aria-label="Jump to page">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg>
              </button>
            </div>
          </nav>
        </div>
      </section>
    </div>
  </main>

  <!-- Full Game Detail Modal (Minimal text, rich media, video trailer, studio & store links) -->
  <div class="game-modal-backdrop" id="game-detail-modal" aria-hidden="true" style="display: none;">
    <div class="game-modal-dialog" role="dialog" aria-modal="true" aria-labelledby="modal-game-title">
      <button class="modal-close-btn" id="modal-close-btn" aria-label="Close dialog">&times;</button>
      <div class="modal-body" id="modal-content">
        <!-- Injected dynamically on card click -->
      </div>
    </div>
  </div>

  <!-- Clean Footer -->
  <footer class="zen-footer">
    <div class="container footer-container">
      <span>&copy; 2026 SAMTAGON STUDIOS</span>
      <div class="footer-links">
        <a href="index.html">Home</a>
        <a href="games.html">Games</a>
        <a href="https://sachinapr20.itch.io/" target="_blank" rel="noopener noreferrer">itch.io</a>
        <a href="https://github.com/SachinyadavAug20" target="_blank" rel="noopener noreferrer">GitHub</a>
      </div>
    </div>
  </footer>

  <!-- Scripts -->
  <script type="module" src="dist/js/recommendations.bundle.js?v=3.0"></script>
</body>
</html>
